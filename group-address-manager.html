function openBulk(){if(!state.editMode)return;const ids=[...state.selectedGroups];if(!ids.length){toast('Select one or more groups first','error');return}openModal('Bulk Operations',body=>{body.append(make('p','',ids.length+' groups selected.'));const r=make('div','form-row');r.append(make('label','','COMPOSITION ADDRESS'));const inp=make('input');inp.id='bulk-comp';r.append(inp);body.append(r)},[{text:'Close',close:true},{text:'Add Composition',class:'btn',action:()=>bulkComp(ids,'add')},{text:'Remove Composition',class:'btn',action:()=>bulkComp(ids,'remove')},{text:'Export Selected',class:'btn',action:()=>exportSelected(ids)},{text:'Delete Selected',class:'btn danger',action:()=>openConfirm('Bulk Delete?','Delete '+ids.length+' groups. A backup will download first. Type DELETE to confirm.','DELETE',()=>{backupJSON();snapshotBefore('Bulk Delete');state.db=state.db.filter(g=>!ids.includes(g.id));state.selectedGroups.clear();rebuildIndexes();saveDatabase();closeModal(true);setView('groups');toast('Bulk delete completed')})}],true)}
function bulkComp(ids,mode){const c=norm($('#bulk-comp').value);if(!c){toast('Composition address required','error');return}snapshotBefore('Bulk '+mode+' '+c);for(const id of ids){if(mode==='add')addComposition(id,c);else removeComposition(id,c)}rebuildIndexes();saveDatabase();closeModal(true);setView('groups');toast('Bulk '+mode+' completed')}
function exportSelected(ids){const groups=state.db.filter(g=>ids.includes(g.id));download('group-address-selected-'+fileStamp()+'.json',JSON.stringify({meta:state.meta,groups},null,2),'application/json')}
function exportSearchResults(){const multi=multiAddressResults(state.searchQuery);let groups;if(multi)groups=multi.groups;else{const ids=new Set(searchScores(state.searchQuery).filter(x=>x.kind==='group').map(x=>x.g.id));for(const x of searchScores(state.searchQuery).filter(x=>x.kind==='comp'))(state.compositionToGroups.get(x.address)||new Set()).forEach(id=>ids.add(id));groups=state.db.filter(g=>ids.has(g.id))}download('group-address-search-results-'+fileStamp()+'.json',JSON.stringify({query:state.searchQuery,mode:state.searchMode,groups},null,2),'application/json')}
function openSetQuery(){openModal('Composition Set Query',body=>{const f=make('div','form-grid');[['Contains (space separated)','sq-in'],['Does not contain','sq-out']].forEach(([l,id])=>{const r=make('div','form-row');r.append(make('label','',l));const i=make('input');i.id=id;r.append(i);f.append(r)});body.append(f);const out=make('div');out.id='sq-results';body.append(out)},[{text:'Close',close:true},{text:'Run Query',class:'btn primary',action:()=>{const inc=parseComps($('#sq-in').value),exc=parseComps($('#sq-out').value);const groups=state.db.filter(g=>inc.every(c=>g.compositions.includes(c))&&exc.every(c=>!g.compositions.includes(c)));const out=$('#sq-results');clear(out);out.append(make('p','',groups.length+' matching groups'));groups.slice(0,100).forEach(g=>{const r=make('div','list-row');r.append(addressEl(g.groupAddress,'group',()=>{closeModal(true);openGroup(g.groupAddress)}),make('span','badge',g.compositions.length+' members'));out.append(r)})}}],true)}
function printGroup(g){const p=$('#printView');clear(p);const s=make('div','print-sheet');s.append(make('h1','address',g.groupAddress),make('p','',g.description||'No description'),make('p','',g.compositions.length+' compositions'));const c=make('div','print-comps');[...g.compositions].sort().forEach(x=>c.append(make('div','address',x)));s.append(c);p.append(s);window.print()}
function openModal(title,build,actions=[],large=false){state.modalLastFocus=document.activeElement;const bd=$('#modalBackdrop'),m=$('#modal');clear(m);m.className='modal'+(large?' large':'');const h=make('div','modal-head');h.append(make('strong','',title),btn('×',()=>attemptCloseModal(),'btn ghost'));const body=make('div','modal-body');build(body);const foot=make('div','modal-foot');actions.forEach(a=>{const b=btn(a.text,()=>{if(a.close)closeModal(true);else a.action?.()},a.class||'btn');foot.append(b)});m.append(h,body,foot);bd.classList.add('open');trapFocus(m)}
function openConfirm(title,message,required,onConfirm){openModal(title,body=>{body.append(make('p','',message));const r=make('div','form-row');r.append(make('label','','CONFIRMATION'));const i=make('input');i.id='confirm-text';i.autocomplete='off';r.append(i);body.append(r)},[{text:'Cancel',close:true},{text:'Confirm',class:'btn danger',action:()=>{if(norm($('#confirm-text').value)!==norm(required)){toast('Confirmation text does not match.','error');return}onConfirm()}}]);setTimeout(()=>$('#confirm-text')?.focus(),0)}
function attemptCloseModal(){if(state.unsaved){openConfirm('Unsaved changes','You have unsaved changes. Type DISCARD to close without saving.','DISCARD',()=>{state.unsaved=false;closeModal(true)})}else closeModal(true)}
function closeModal(force=false){if(state.unsaved&&!force){attemptCloseModal();return}state.unsaved=false;$('#modalBackdrop').classList.remove('open');clear($('#modal'));state.modalLastFocus?.focus?.()}
function trapFocus(modal){const focusables=()=>Array.from(modal.querySelectorAll('button,input,textarea,select,[tabindex]:not([tabindex="-1"])')).filter(x=>!x.disabled);modal.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();attemptCloseModal()}if(e.key==='Tab'){const f=focusables();if(!f.length)return;const first=f[0],last=f[f.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}
function renderCommand(){const q=norm($('#commandInput').value),items=[];const commands=[['Add Group',()=>openGroupModal()],['Compare Groups',()=>openCompare()],['Import / Export',()=>setView('transfer')],['Data Quality',()=>setView('quality')],['Dashboard',()=>setView('dashboard')]];commands.filter(([n])=>!q||n.toUpperCase().includes(q)).forEach(([name,action])=>items.push({label:name,sub:'Command',action}));searchScores(q).slice(0,15).forEach(x=>items.push({label:x.address,sub:x.kind==='group'?'Group Address':'Composition · '+x.count+' groups',action:()=>x.kind==='group'?openGroup(x.address):openComposition(x.address)}));state.commandItems=items;state.commandIndex=Math.min(state.commandIndex,Math.max(0,items.length-1));const r=$('#commandResults');clear(r);items.forEach((x,i)=>{const e=make('div','command-item '+(i===state.commandIndex?'sel':''));e.append(make('span','mono',x.label),make('span','muted',x.sub));e.onclick=()=>{closeCommand();x.action()};r.append(e)})}
function openCommand(){state.commandIndex=0;$('#command').classList.add('open');$('#commandInput').value='';renderCommand();setTimeout(()=>$('#commandInput').focus(),0)}function closeCommand(){$('#command').classList.remove('open')}
function wire(){loadDatabase();renderSideLists();$$('#nav button').forEach(b=>b.onclick=()=>setView(b.dataset.view));$('#mobileMenu').onclick=()=>$('#sidebar').classList.toggle('open');$('#cmdBtn').onclick=openCommand;$('#backupBtn').onclick=backupJSON;$('#topSearch').oninput=e=>{state.searchQuery=e.target.value;setView('search')};$('#topSearch').onkeydown=e=>{if(e.key==='Enter'&&state.searchQuery.trim()){const r=searchScores(state.searchQuery)[0];if(r)r.kind==='group'?openGroup(r.address):openComposition(r.address)}};$('#modalBackdrop').onclick=e=>{if(e.target===$('#modalBackdrop'))attemptCloseModal()};$('#command').onclick=e=>{if(e.target===$('#command'))closeCommand()};$('#commandInput').oninput=()=>{state.commandIndex=0;renderCommand()};$('#commandInput').onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();state.commandIndex=Math.min(state.commandItems.length-1,state.commandIndex+1);renderCommand()}else if(e.key==='ArrowUp'){e.preventDefault();state.commandIndex=Math.max(0,state.commandIndex-1);renderCommand()}else if(e.key==='Enter'){e.preventDefault();const x=state.commandItems[state.commandIndex];if(x){closeCommand();x.action()}}else if(e.key==='Escape')closeCommand()};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommand()}else if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#topSearch').focus()}else if(e.key==='Escape'&&!$('#modalBackdrop').classList.contains('open')){if($('#command').classList.contains('open'))closeCommand();else document.activeElement?.blur?.()}});window.addEventListener('beforeunload',e=>{if(state.unsaved){e.preventDefault();e.returnValue=''}});renderDashboard();applyEditVisibility()}
wire();
</script>
