function storageGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function storageSet(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function highlight(text,q){const e=esc(text), n=(q||'').trim();if(!n)return e;return e.replace(new RegExp('('+reEsc(esc(n))+')','ig'),'<mark>$1</mark>')}

function parseAddresses(text){const raw=(text||'').split(/[\s,;]+/).map(norm).filter(Boolean), seen=new Set(),out=[],dups=[];for(const x of raw){if(seen.has(x))dups.push(x);else{seen.add(x);out.push(x)}}return {items:out,dups}}
function validateAddress(v){const x=norm(v);const warnings=[];if(!x)return {ok:false,value:x,warnings:['Address is empty.']};if(/\s/.test(x))warnings.push('Contains whitespace.');if(!/^[A-Z0-9_-]+$/.test(x))warnings.push('Contains unusual characters.');if(x.length<3||x.length>16)warnings.push('Unusual address length.');return {ok:true,value:x,warnings}}
function rebuildIndexes(){groupByAddress=new Map();compositionToGroups=new Map();for(const g of state.db){groupByAddress.set(norm(g.groupAddress),g);for(const c of g.compositions){const k=norm(c);if(!compositionToGroups.has(k))compositionToGroups.set(k,[]);compositionToGroups.get(k).push(g)}}state.meta.totalGroups=state.db.length}

function loadDatabase(){try{state.db=JSON.parse(storageGet(STORAGE.db)||'null')||deepClone(ORIGINAL_DATASET);state.meta=JSON.parse(storageGet(STORAGE.meta)||'null')||state.meta;state.editMode=storageGet(STORAGE.edit)==='1';state.favorites=new Set(JSON.parse(storageGet(STORAGE.fav)||'[]'));state.recent=JSON.parse(storageGet(STORAGE.recent)||'[]');state.history=JSON.parse(storageGet(STORAGE.history)||'[]');state.snapshots=JSON.parse(storageGet(STORAGE.snapshots)||'[]')}catch(e){state.db=deepClone(ORIGINAL_DATASET)}rebuildIndexes()}
function recordHistory(operation,group,before,after,undoFn){const item={id:uid(),timestamp:nowISO(),operation,group,before:deepClone(before),after:deepClone(after)};state.history.unshift(item);if(undoFn)state.sessionUndo.push({id:item.id,fn:undoFn});state.history=state.history.slice(0,500)}
function addGroup(input){const ga=norm(input.groupAddress);if(groupByAddress.has(ga))throw Error('Group Address already exists.');const p=parseAddresses((input.compositions||[]).join?input.compositions.join(' '):input.compositions);const g={id:uid(),groupAddress:ga,description:(input.description||'').trim(),compositions:p.items,createdAt:nowISO(),updatedAt:nowISO()};state.db.push(g);rebuildIndexes();recordHistory('Add Group',ga,null,g,()=>{state.db=state.db.filter(x=>x.id!==g.id);rebuildIndexes();saveDatabase();renderRoute()});saveDatabase();return {group:g,duplicates:p.dups}}
function updateGroup(id,input){const g=state.db.find(x=>x.id===id);if(!g)throw Error('Group not found.');const before=deepClone(g),ga=norm(input.groupAddress),other=groupByAddress.get(ga);if(other&&other.id!==id)throw Error('Group Address already exists.');const p=parseAddresses((input.compositions||[]).join?input.compositions.join(' '):input.compositions);g.groupAddress=ga;g.description=(input.description||'').trim();g.compositions=p.items;g.updatedAt=nowISO();const after=deepClone(g);rebuildIndexes();recordHistory('Update Group',ga,before,after,()=>{Object.assign(g,deepClone(before));rebuildIndexes();saveDatabase();renderRoute()});saveDatabase();return {group:g,duplicates:p.dups}}
function deleteGroup(id){const idx=state.db.findIndex(x=>x.id===id);if(idx<0)return;const before=deepClone(state.db[idx]);state.db.splice(idx,1);rebuildIndexes();recordHistory('Delete Group',before.groupAddress,before,null,()=>{state.db.splice(idx,0,deepClone(before));rebuildIndexes();saveDatabase();renderRoute()});saveDatabase()}
function addComposition(groupId,address){const g=state.db.find(x=>x.id===groupId);if(!g)throw Error('Group not found.');const a=norm(address);if(!a)throw Error('Address is empty.');if(g.compositions.some(x=>norm(x)===a))return false;const before=deepClone(g);g.compositions.push(a);g.updatedAt=nowISO();rebuildIndexes();recordHistory('Add Composition',g.groupAddress,before,g,()=>{Object.assign(g,deepClone(before));rebuildIndexes();saveDatabase();renderRoute()});saveDatabase();return true}
function removeComposition(groupId,address){const g=state.db.find(x=>x.id===groupId);if(!g)return;const before=deepClone(g),a=norm(address);g.compositions=g.compositions.filter(x=>norm(x)!==a);g.updatedAt=nowISO();rebuildIndexes();recordHistory('Remove Composition',g.groupAddress,before,g,()=>{Object.assign(g,deepClone(before));rebuildIndexes();saveDatabase();renderRoute()});saveDatabase()}
function renameCompositionGlobally(oldAddr,newAddr,selectedIds=null){const oldA=norm(oldAddr),newA=norm(newAddr);if(!oldA||!newA)throw Error('Address is required.');const affected=(compositionToGroups.get(oldA)||[]).filter(g=>!selectedIds||selectedIds.includes(g.id));const before=affected.map(deepClone);for(const g of affected){g.compositions=[...new Set(g.compositions.map(c=>norm(c)===oldA?newA:norm(c)))];g.updatedAt=nowISO()}rebuildIndexes();recordHistory('Global Rename',oldA,before,affected,()=>{for(const old of before){const g=state.db.find(x=>x.id===old.id);if(g)Object.assign(g,deepClone(old))}rebuildIndexes();saveDatabase();renderRoute()});saveDatabase();return affected.length}

function searchScore(g,q){const Q=norm(q),ga=norm(g.groupAddress),desc=norm(g.description),comps=g.compositions.map(norm);if(ga===Q)return 1;if(comps.includes(Q))return 2;if(ga.startsWith(Q))return 3;if(comps.some(c=>c.startsWith(Q)))return 4;if(ga.includes(Q))return 5;if(comps.some(c=>c.includes(Q)))return 6;if(desc.includes(Q))return 7;return 99}

function parseCSV(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'&&text[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=ch}}row.push(cell.replace(/\r$/,''));if(row.some(x=>x!==''))rows.push(row);const head=rows.shift()?.map(norm)||[];const gi=head.indexOf('GROUP ADDRESS'),di=head.indexOf('DESCRIPTION'),ci=head.indexOf('COMPOSITION');if(gi<0||ci<0)throw Error('CSV must contain GROUP ADDRESS and COMPOSITION columns.');return rows.filter(r=>r.some(Boolean)).map(r=>({id:uid(),groupAddress:norm(r[gi]),description:di>=0?(r[di]||'').trim():'',compositions:parseAddresses(r[ci]||'').items,createdAt:nowISO(),updatedAt:nowISO()}))}

function editorDiff(original,current){if(!original)return {added:current,removed:[],unchanged:0};const a=new Set(original.map(norm)),b=new Set(current.map(norm));return {added:[...b].filter(x=>!a.has(x)),removed:[...a].filter(x=>!b.has(x)),unchanged:[...a].filter(x=>b.has(x)).length}}
function openGroupEditor(group=null,opts={}){if(!state.editMode)return;const duplicate=opts.duplicate,base=group?deepClone(group):{groupAddress:opts.groupAddress||'',description:'',compositions:[]};if(duplicate)base.groupAddress='';let work=[...base.compositions];const title=group?(duplicate?'Duplicate Group':'Edit Group'):'Add Group';openModal(`<div class="modal-head"><h2>${title}</h2><p>${group&&!duplicate?`Editing ${esc(group.groupAddress)}`:'Create a group address and composition membership.'}</p></div><div class="modal-body"><div class="modal-grid"><div class="field"><label>Group Address</label><input id="editGA" class="input mono" value="${esc(base.groupAddress)}" placeholder="GROUP ADDRESS"></div><div class="field"><label>Description</label><textarea id="editDesc" class="textarea" placeholder="Optional description">${esc(base.description)}</textarea></div><div class="field"><label>Add composition</label><input id="addCompInput" class="input mono" placeholder="Paste one or many addresses, then press Enter"></div><div id="editWarnings"></div><div class="chips" id="editChips"></div><div id="editDiff"></div></div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="previewSave">Review Changes</button></div>`,{noBackdrop:false});const render=()=>{$('#editChips').innerHTML=work.map(c=>`<span class="chip"><span class="chip-main">${esc(c)}</span><button class="chip-x" data-rm-edit="${esc(c)}">×</button></span>`).join('');$$('[data-rm-edit]').forEach(b=>b.onclick=()=>{const used=(compositionToGroups.get(norm(b.dataset.rmEdit))||[]).filter(x=>!group||x.id!==group.id).length;if(used&&!confirm(`${b.dataset.rmEdit} is also used in ${used} other groups. Remove only from this group?`))return;work=work.filter(x=>norm(x)!==norm(b.dataset.rmEdit));state.unsaved=true;render()});const d=editorDiff(group&&!duplicate?group.compositions:[],work);$('#editDiff').innerHTML=`<div class="diff"><div class="diff-box"><b>ADDED</b>${d.added.length?d.added.map(x=>`+ ${esc(x)}`).join('<br>'):'None'}</div><div class="diff-box"><b>REMOVED</b>${d.removed.length?d.removed.map(x=>`- ${esc(x)}`).join('<br>'):'None'}</div></div><div class="muted" style="font-size:11px;margin-top:7px">UNCHANGED: ${d.unchanged} addresses</div>`};render();$('#addCompInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const p=parseAddresses(e.target.value);let added=0;for(const x of p.items)if(!work.includes(x)){work.push(x);added++}if(p.dups.length||added<p.items.length)toast('Duplicate compositions removed');e.target.value='';state.unsaved=true;render()}};$('#addCompInput').onpaste=e=>setTimeout(()=>{const p=parseAddresses(e.target.value);if(p.items.length>1){for(const x of p.items)if(!work.includes(x))work.push(x);e.target.value='';state.unsaved=true;render()}},0);$('#editGA').oninput=$('#editDesc').oninput=()=>state.unsaved=true;$('#previewSave').onclick=()=>{const val=validateAddress($('#editGA').value);if(!val.ok){alert(val.warnings.join('\n'));return}const conflict=groupByAddress.get(val.value);if(conflict&&(!group||duplicate||conflict.id!==group.id)){alert('Group Address already exists.');return}const warns=val.warnings;if(warns.length&&!confirm(warns.join('\n')+'\n\nForce Save?'))return;const payload={groupAddress:val.value,description:$('#editDesc').value,compositions:work};const d=editorDiff(group&&!duplicate?group.compositions:[],work),changed=!group||duplicate||norm(group.groupAddress)!==val.value||group.description!==payload.description||d.added.length||d.removed.length;if(!changed){alert('No changes to save.');return}openSaveConfirm(group,duplicate,payload,d)}}
function openSaveConfirm(group,duplicate,payload,diff){openModal(`<div class="modal-head"><h2>Review Changes</h2><p>Confirm the changes before saving.</p></div><div class="modal-body"><div class="diff"><div class="diff-box"><b>ADDED</b>${diff.added.length?diff.added.map(x=>`+ ${esc(x)}`).join('<br>'):'None'}</div><div class="diff-box"><b>REMOVED</b>${diff.removed.length?diff.removed.map(x=>`- ${esc(x)}`).join('<br>'):'None'}</div></div><div class="muted" style="margin-top:9px;font-size:12px">UNCHANGED: ${diff.unchanged} addresses</div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="confirmSave">Save</button></div>`);$('#confirmSave').onclick=()=>{try{const r=(!group||duplicate)?addGroup(payload):updateGroup(group.id,payload);state.unsaved=false;closeModal(true);openGroup(r.group.groupAddress);toast('Saved');if(r.duplicates.length)toast('Duplicate compositions removed')}catch(e){alert(e.message)}}}
function openDeleteModal(g){if(!g||!state.editMode)return;openModal(`<div class="modal-head"><h2>Delete ${esc(g.groupAddress)}?</h2><p>This group contains ${g.compositions.length} compositions.</p></div><div class="modal-body"><div class="danger-note">Type <b class="mono">${esc(g.groupAddress)}</b> to confirm deletion.</div><div class="field" style="margin-top:12px"><label>Confirmation</label><input id="deleteConfirm" class="input mono"></div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn danger" id="deleteNow">Delete</button></div>`);$('#deleteNow').onclick=()=>{if(norm($('#deleteConfirm').value)!==norm(g.groupAddress)){alert('Confirmation does not match.');return}deleteGroup(g.id);closeModal(true);navigate('groups');toast('Group deleted')}}
function openRenameModal(oldA){const groups=compositionToGroups.get(norm(oldA))||[];openModal(`<div class="modal-head"><h2>Rename Composition Globally</h2><p>This change may affect ${groups.length} Group Addresses.</p></div><div class="modal-body"><div class="field"><label>Old</label><input class="input mono" value="${esc(oldA)}" disabled></div><div class="field" style="margin-top:12px"><label>New</label><input id="newGlobal" class="input mono" placeholder="New composition address"></div><div class="field" style="margin-top:12px"><label>Scope</label><select id="renameScope" class="select"><option value="all">Replace Globally</option><option value="selected">Replace Selected Groups</option></select></div><div id="renameGroups" style="margin-top:12px">${groups.map(g=>`<label class="side-link"><input type="checkbox" class="renameCheck" value="${g.id}" checked> <span class="mono">${esc(g.groupAddress)}</span></label>`).join('')}</div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn" id="backupRename">Download Backup</button><button class="btn primary" id="doRename">Rename</button></div>`);$('#backupRename').onclick=backup;$('#renameScope').onchange=e=>$('#renameGroups').classList.toggle('hidden',e.target.value==='all');$('#doRename').onclick=()=>{const v=validateAddress($('#newGlobal').value);if(!v.ok){alert(v.warnings.join('\n'));return}const ids=$('#renameScope').value==='selected'?$$('.renameCheck:checked').map(x=>x.value):null;const n=renameCompositionGlobally(oldA,v.value,ids);closeModal(true);openComposition(v.value);toast(`Renamed in ${n} groups`)}}
function openBulkComposition(mode){openModal(`<div class="modal-head"><h2>${mode==='add'?'Add':'Remove'} Composition — Bulk</h2><p>Apply to ${state.selectedGroups.size} selected groups.</p></div><div class="modal-body"><div class="field"><label>Composition Address</label><input id="bulkComp" class="input mono"></div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="bulkCompGo">Apply</button></div>`);$('#bulkCompGo').onclick=()=>{const a=norm($('#bulkComp').value);if(!a)return;for(const id of state.selectedGroups){const g=state.db.find(x=>x.id===id);if(!g)continue;if(mode==='add'&&!g.compositions.includes(a))g.compositions.push(a);if(mode==='remove')g.compositions=g.compositions.filter(c=>norm(c)!==a);g.updatedAt=nowISO()}rebuildIndexes();recordHistory(`Bulk ${mode==='add'?'Add':'Remove'} Composition`,a,null,{groups:state.selectedGroups.size},null);saveDatabase();closeModal(true);renderDirectoryRows();toast('Bulk operation completed')}}
function openBulkDelete(){openModal(`<div class="modal-head"><h2>Delete Selected Groups</h2><p>This will delete ${state.selectedGroups.size} selected groups.</p></div><div class="modal-body"><div class="danger-note">Download a backup before continuing if you may need to restore these groups.</div></div><div class="modal-foot"><button class="btn" data-close-modal>Cancel</button><button class="btn" id="backupBulk">Download Backup</button><button class="btn danger" id="bulkDeleteNow">Delete Selected</button></div>`);$('#backupBulk').onclick=backup;$('#bulkDeleteNow').onclick=()=>{const ids=new Set(state.selectedGroups),before=state.db.filter(g=>ids.has(g.id)).map(deepClone);state.db=state.db.filter(g=>!ids.has(g.id));state.selectedGroups.clear();rebuildIndexes();recordHistory('Bulk Delete','MULTIPLE',before,null,null);saveDatabase();closeModal(true);renderDirectoryRows();toast('Selected groups deleted')}}
function openCommandPalette(){openModal(`<div class="palette"><input id="paletteInput" class="palette-input" placeholder="Type a command..."><div id="paletteList"></div></div>`);const cmds=[['Search Group',()=>navigate('search',{focus:true})],['Search Composition',()=>navigate('search',{focus:true})],...(state.editMode?[['Add Group',()=>{closeModal(true);openGroupEditor()}]]:[]),['Compare Groups',()=>navigate('compare')],['Import',()=>navigate('io')],['Export',()=>exportJSON()],['Backup',backup],['Settings',()=>navigate('settings')]];const render=()=>{const q=norm($('#paletteInput').value);const arr=cmds.filter(([n])=>!q||norm(n).includes(q));$('#paletteList').innerHTML=arr.map(([n],i)=>`<button class="command" data-cmd="${i}"><span>${esc(n)}</span><span class="kbd">Enter</span></button>`).join('');$$('[data-cmd]').forEach((b,i)=>b.onclick=()=>{closeModal(true);arr[i][1]()})};$('#paletteInput').oninput=render;render();setTimeout(()=>$('#paletteInput').focus(),0)}
window.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommandPalette();return}if(e.key==='Escape'){if(state.modal)closeModal();else if(state.drawer){state.drawer=false;renderShell();renderRoute()}return}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)){e.preventDefault();if(state.route.page!=='search')navigate('search',{focus:true});else $('#globalSearch')?.focus()}})
window.addEventListener('beforeunload',e=>{if(state.unsaved){e.preventDefault();e.returnValue=''}});
loadDatabase();renderShell();renderRoute();
</script>
</body>
