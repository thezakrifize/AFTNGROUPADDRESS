function deepClone(o){return JSON.parse(JSON.stringify(o))}
function load(){try{state.db=JSON.parse(localStorage.getItem(K.db)||'null')||deepClone(ORIGINAL_DATASET);state.meta=JSON.parse(localStorage.getItem(K.meta)||'null')||{...META_DEFAULT};state.history=JSON.parse(localStorage.getItem(K.history)||'[]');state.favorites=new Set(JSON.parse(localStorage.getItem(K.favorites)||'[]'));state.recent=JSON.parse(localStorage.getItem(K.recent)||'[]');state.editMode=localStorage.getItem(K.edit)==='true';state.theme=localStorage.getItem(K.theme)||'light'}catch{state.db=deepClone(ORIGINAL_DATASET)}document.documentElement.dataset.theme=state.theme;rebuildIndexes()}
function saveDatabase(){state.meta.lastModified=now();state.meta.totalGroups=state.db.length;localStorage.setItem(K.db,JSON.stringify(state.db));localStorage.setItem(K.meta,JSON.stringify(state.meta));rebuildIndexes();renderSide();}
function rebuildIndexes(){const group=new Map(),comp=new Map();for(const g of state.db){group.set(norm(g.groupAddress),g);for(const c of g.compositions){const k=norm(c);if(!comp.has(k))comp.set(k,new Set());comp.get(k).add(g.id)}}state.indexes={group,comp}}
function record(op,group,before,after,undo){const h={id:uuid(),timestamp:now(),operation:op,group:group||'',before:before??null,after:after??null,undo:undo||null};state.history.unshift(h);state.history=state.history.slice(0,500);localStorage.setItem(K.history,JSON.stringify(state.history));return h}
function addGroup(obj,{history=true}={}){const address=norm(obj.groupAddress);if(state.indexes.group.has(address))throw new Error('Group Address already exists.');const comps=dedup(parseComps(obj.compositions||[]));const g={id:obj.id||uuid(),groupAddress:address,description:String(obj.description||'').trim(),compositions:comps,createdAt:obj.createdAt||now(),updatedAt:now()};state.db.push(g);if(history)record('Add Group',address,null,deepClone(g),{type:'deleteGroup',id:g.id});saveDatabase();return g}
function updateGroup(id,patch,{history=true}={}){const i=state.db.findIndex(g=>g.id===id);if(i<0)throw new Error('Group not found.');const old=deepClone(state.db[i]);const address=norm(patch.groupAddress??old.groupAddress);const existing=state.indexes.group.get(address);if(existing&&existing.id!==id)throw new Error('Group Address already exists.');const comps=dedup(parseComps(patch.compositions??old.compositions));state.db[i]={...old,groupAddress:address,description:String(patch.description??old.description).trim(),compositions:comps,updatedAt:now()};const neu=deepClone(state.db[i]);if(history)record('Edit Group',address,old,neu,{type:'restoreGroup',group:old});saveDatabase();return neu}
function deleteGroup(id,{history=true}={}){const i=state.db.findIndex(g=>g.id===id);if(i<0)return;const old=deepClone(state.db[i]);state.db.splice(i,1);state.favorites.delete(old.groupAddress);saveFavorites();if(history)record('Delete Group',old.groupAddress,old,null,{type:'addGroup',group:old});saveDatabase()}
function addComposition(id,c){const g=state.db.find(x=>x.id===id);if(!g)return;return updateGroup(id,{compositions:[...g.compositions,norm(c)]})}
function removeComposition(id,c){const g=state.db.find(x=>x.id===id);if(!g)return;return updateGroup(id,{compositions:g.compositions.filter(x=>norm(x)!==norm(c))})}
function renameCompositionGlobally(oldC,newC,selectedIds=null){oldC=norm(oldC);newC=norm(newC);const ids=selectedIds?new Set(selectedIds):null;const before=[];for(const g of state.db){if(g.compositions.includes(oldC)&&(!ids||ids.has(g.id))){before.push(deepClone(g));g.compositions=dedup(g.compositions.map(c=>c===oldC?newC:c));g.updatedAt=now()}}if(!before.length)return 0;record('Global Rename',oldC,before,{old:oldC,new:newC,groups:before.map(g=>g.id)},{type:'restoreMany',groups:before});saveDatabase();return before.length}
function parseComps(v){if(Array.isArray(v))return v.map(norm).filter(Boolean);return String(v||'').split(/[\s,;\t]+/).map(norm).filter(Boolean)}
function dedup(a){return [...new Set(a.map(norm).filter(Boolean))]}
function validationWarnings(address,comps){const warnings=[];if(/\s/.test(address))warnings.push('Group Address contains whitespace.');if(/[^A-Z0-9_-]/.test(address))warnings.push('Group Address contains unusual characters.');for(const c of comps){if(/\s/.test(c)||/[^A-Z0-9_-]/.test(c))warnings.push(`${c} has unusual formatting.`)}return [...new Set(warnings)]}
function saveFavorites(){localStorage.setItem(K.favorites,JSON.stringify([...state.favorites]));renderSide()}
function toggleFavorite(a){a=norm(a);state.favorites.has(a)?state.favorites.delete(a):state.favorites.add(a);saveFavorites();render()}
function touchRecent(type,value){const k=type+':'+value;state.recent=state.recent.filter(x=>x.key!==k);state.recent.unshift({key:k,type,value,timestamp:now()});state.recent=state.recent.slice(0,10);localStorage.setItem(K.recent,JSON.stringify(state.recent));renderSide()}

function exportCSV(groups=state.db){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const lines=['GROUP ADDRESS,DESCRIPTION,COMPOSITION',...groups.map(g=>[q(g.groupAddress),q(g.description),q(g.compositions.join(' '))].join(','))];download('group-address-export.csv','\ufeff'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function exportJSON(groups=state.db,name='group-address-export.json'){download(name,JSON.stringify({metadata:{...state.meta,totalGroups:groups.length},groups},null,2))}
function parseCSV(txt){const rows=[];let row=[],cell='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i],n=txt[i+1];if(q){if(c==='"'&&n==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else{if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}}if(cell||row.length){row.push(cell);rows.push(row)}if(!rows.length)return[];const h=rows.shift().map(norm);const gi=h.indexOf('GROUP ADDRESS'),di=h.indexOf('DESCRIPTION'),ci=h.indexOf('COMPOSITION');if(gi<0||ci<0)throw new Error('CSV must contain GROUP ADDRESS and COMPOSITION columns.');return rows.filter(r=>r.some(Boolean)).map(r=>({groupAddress:norm(r[gi]),description:di>=0?String(r[di]||'').trim():'',compositions:parseComps(r[ci]||'')})).filter(g=>g.groupAddress)}

function renderSide(){renderNav();const unique=state.indexes.comp.size;$('#sideStats').innerHTML=`<div>Total Groups <b>${fmtNum(state.db.length)}</b></div><div>Unique Compositions <b>${fmtNum(unique)}</b></div><div>Last Updated <b>${esc(new Date(state.meta.lastModified).toLocaleDateString())}</b></div>`;const fav=$('#sideFavorites');fav.innerHTML='';const arr=[...state.favorites].filter(a=>state.indexes.group.has(a)).slice(0,6);if(!arr.length)fav.innerHTML='<div class="side-mini muted">No favorites yet</div>';for(const a of arr){const b=document.createElement('button');b.className='side-mini addr';b.textContent='★ '+a;b.onclick=()=>navigate('group',{address:a});fav.appendChild(b)}const rec=$('#sideRecent');rec.innerHTML='';if(!state.recent.length)rec.innerHTML='<div class="side-mini muted">Nothing viewed yet</div>';for(const x of state.recent.slice(0,6)){const b=document.createElement('button');b.className='side-mini '+(x.type==='group'||x.type==='comp'?'addr':'');b.textContent=(x.type==='group'?'G · ':'C · ')+x.value;b.onclick=()=>x.type==='group'?navigate('group',{address:x.value}):navigate('composition',{comp:x.value});rec.appendChild(b)}}

function metric(label,value,hint=''){return `<div class="card metric"><div class="label">${esc(label)}</div><div class="value">${fmtNum(value)}</div>${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`}
function renderDashboard(v){const memberships=state.db.reduce((n,g)=>n+g.compositions.length,0),missing=state.db.filter(g=>!g.description).length;v.innerHTML=`<div class="page-head"><div><h1 class="page-title">Dashboard</h1><p class="page-sub">Operational overview of the local Group Address database.</p></div>${state.editMode?`<div class="actions"><button class="btn primary" id="dashAdd">${icon('plus')} Add Group</button></div>`:''}</div><div class="grid metrics">${metric('TOTAL GROUPS',state.db.length,'Group addresses')}${metric('UNIQUE COMPOSITIONS',state.indexes.comp.size,'Distinct member addresses')}${metric('TOTAL MEMBERSHIPS',memberships,'Across all groups')}${metric('GROUPS WITHOUT DESCRIPTION',missing,'Review when convenient')}</div><div class="grid dashboard-sections"><section class="card section"><h2>Most Used Compositions</h2><div id="mostUsed" class="rank"></div></section><section class="card section"><h2>Largest Groups</h2><div id="largest" class="rank"></div></section><section class="card section"><h2>Recently Modified</h2><div id="modified" class="rank"></div></section></div>${footer()}`;if($('#dashAdd'))$('#dashAdd').onclick=()=>openGroupEditor();fillRanks()}
function fillRanks(){const u=[...state.indexes.comp.entries()].map(([c,s])=>[c,s.size]).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);const l=[...state.db].sort((a,b)=>b.compositions.length-a.compositions.length||a.groupAddress.localeCompare(b.groupAddress)).slice(0,10);const m=[...state.db].sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt)).slice(0,10);fillRank($('#mostUsed'),u.map(([a,n])=>({title:a,meta:`${n} groups`,go:()=>navigate('composition',{comp:a})})));fillRank($('#largest'),l.map(g=>({title:g.groupAddress,meta:`${g.compositions.length} compositions`,go:()=>navigate('group',{address:g.groupAddress})})));fillRank($('#modified'),m.map(g=>({title:g.groupAddress,meta:fmtDate(g.updatedAt),go:()=>navigate('group',{address:g.groupAddress})})))}
function fillRank(el,rows){el.innerHTML='';rows.forEach((r,i)=>{const d=document.createElement('div');d.className='rank-row';const n=document.createElement('span');n.className='rank-num';n.textContent=i+1;const b=document.createElement('button');b.className='link addr';b.textContent=r.title;b.onclick=r.go;const m=document.createElement('span');m.className='desc';m.textContent=r.meta;d.append(n,b,m);el.appendChild(d)})}
function priority(g,q){q=norm(q);const ga=norm(g.groupAddress),cs=g.compositions.map(norm),d=norm(g.description);if(ga===q)return 1;if(cs.includes(q))return 2;if(ga.startsWith(q))return 3;if(cs.some(c=>c.startsWith(q)))return 4;if(ga.includes(q))return 5;if(cs.some(c=>c.includes(q)))return 6;if(d.includes(q))return 7;return 99}
function searchGroups(q){q=norm(q);if(!q)return[];return state.db.map(g=>({g,p:priority(g,q)})).filter(x=>x.p<99).sort((a,b)=>a.p-b.p||a.g.groupAddress.localeCompare(b.g.groupAddress)).map(x=>x.g)}
function highlightHTML(text,q){text=String(text||'');q=String(q||'');if(!q)return esc(text);const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return text.split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('')}

function renderSearchAux(mode){const a=$('#searchAux');if(mode==='instant'){a.innerHTML=''}else if(mode==='multi'){a.innerHTML=`<div class="split" style="margin-top:16px"><div><label class="form-label">Paste addresses</label><textarea id="multiText" class="textarea" placeholder="VTBBZPZX\nVTBDZTZX\nVTBSZTZX"></textarea></div><div><label class="form-label">Match mode</label><select id="multiMode" class="select"><option value="ANY">ANY — at least one address</option><option value="ALL">ALL — all addresses required</option></select><div class="help">Matches against compositions within each Group Address.</div><button id="multiRun" class="btn primary" style="margin-top:12px">Run multi-address search</button></div></div>`;$('#multiRun').onclick=runMulti}else{a.innerHTML=`<div style="margin-top:16px"><div class="split"><div><label class="form-label">Contains (one per line)</label><textarea id="advIn" class="textarea" placeholder="VTBBZPZX\nVTBSZTZX"></textarea></div><div><label class="form-label">Does not contain</label><textarea id="advOut" class="textarea" placeholder="VTCCZTZX"></textarea></div></div><button id="advRun" class="btn primary">Apply filter</button></div>`;$('#advRun').onclick=runAdvanced}}
function resultCard(g,q){return `<div class="card result" data-group="${esc(g.groupAddress)}"><div><div class="result-title addr">${highlightHTML(g.groupAddress,q)}</div><div class="desc" style="margin-top:5px">${highlightHTML(g.description||'No description',q)}</div><div class="result-meta"><span>${g.compositions.length} compositions</span><span>Updated ${esc(new Date(g.updatedAt).toLocaleDateString())}</span></div></div><span class="badge">Group</span></div>`}

function renderHistory(v){v.innerHTML=`<div class="page-head"><div><h1 class="page-title">Change History</h1><p class="page-sub">Local session history for administrative changes.</p></div><div class="actions"><button id="undoLast" class="btn" ${state.history.length?'':'disabled'}>${icon('undo')} Undo Last Change</button></div></div><div class="card">${state.history.length?state.history.map(h=>`<div class="history-item"><div class="desc">${esc(fmtDate(h.timestamp))}</div><div class="history-op">${esc(h.operation)}</div><div><div class="addr">${esc(h.group||'—')}</div><div class="desc">${esc(historySummary(h))}</div></div></div>`).join(''):'<div class="empty"><strong>No changes yet</strong>Edits, imports, deletes and renames will appear here.</div>'}</div>${footer()}`;$('#undoLast').onclick=undoLast}
function historySummary(h){if(h.operation==='Edit Group'&&h.before&&h.after){const a=new Set(h.before.compositions||[]),b=new Set(h.after.compositions||[]);return `Added ${[...b].filter(x=>!a.has(x)).length}, removed ${[...a].filter(x=>!b.has(x)).length}`};if(Array.isArray(h.before))return `${h.before.length} affected records`;return h.operation}
function undoLast(){const h=state.history.shift();if(!h?.undo)return toast('No undo data available','warning');const u=h.undo;try{if(u.type==='deleteGroup')deleteGroup(u.id,{history:false});else if(u.type==='addGroup')addGroup(u.group,{history:false});else if(u.type==='restoreGroup'){const i=state.db.findIndex(g=>g.id===u.group.id);if(i>=0)state.db[i]=deepClone(u.group);else state.db.push(deepClone(u.group));saveDatabase()}else if(u.type==='restoreMany'){for(const g of u.groups){const i=state.db.findIndex(x=>x.id===g.id);if(i>=0)state.db[i]=deepClone(g);else state.db.push(deepClone(g))}saveDatabase()}else if(u.type==='restoreDatabase'){state.db=deepClone(u.groups);saveDatabase()}localStorage.setItem(K.history,JSON.stringify(state.history));render();toast('Undo completed')}catch(e){toast('Undo failed: '+e.message,'error')}}
function renderSettings(v){const snaps=JSON.parse(localStorage.getItem(K.snapshots)||'[]');v.innerHTML=`<div class="page-head"><div><h1 class="page-title">Settings</h1><p class="page-sub">Local application preferences and database controls.</p></div></div><div class="settings-grid"><section class="card setting-section"><h2 style="margin-top:0">Application</h2><div class="setting-row"><div><b>Edit Mode</b><div class="desc">Show administrative Add, Edit, Delete and bulk controls.</div></div><label class="switch"><input id="editToggle" type="checkbox" ${state.editMode?'checked':''}><span class="slider"></span></label></div><div class="setting-row"><div><b>Dark Mode</b><div class="desc">Professional neutral dark appearance.</div></div><label class="switch"><input id="themeToggle" type="checkbox" ${state.theme==='dark'?'checked':''}><span class="slider"></span></label></div><div class="setting-row"><div><b>Directory Page Size</b><div class="desc">Number of groups rendered per page.</div></div><select id="pageSize" class="select"><option>25</option><option>50</option><option>100</option></select></div></section><section class="card setting-section"><h2 style="margin-top:0">Database</h2><div class="setting-row"><div><b>Dataset Version</b><div class="desc">Version ${state.meta.version}</div></div></div><div class="setting-row"><div><b>Snapshot</b><div class="desc">Keep up to 10 local snapshots.</div></div><button id="makeSnapshot" class="btn small">Create</button></div><div class="setting-row"><div><b>Saved Snapshots</b><div class="desc">${snaps.length} available</div></div><button id="manageSnapshots" class="btn small" ${snaps.length?'':'disabled'}>Manage</button></div><div class="setting-row"><div><b>Reset to Original Dataset</b><div class="desc">Restore the exact 19 AUG source dataset.</div></div><button id="resetDb" class="btn small" style="color:var(--danger)">Reset</button></div></section></div><section class="card setting-section section-block"><h2 style="margin-top:0">Dataset Metadata</h2><div class="split"><div><span class="desc">Dataset Name</span><div>${esc(state.meta.datasetName)}</div></div><div><span class="desc">Source Date</span><div>${esc(state.meta.sourceDate)}</div></div><div><span class="desc">Total Groups</span><div>${state.db.length}</div></div><div><span class="desc">Last Modified</span><div>${esc(fmtDate(state.meta.lastModified))}</div></div></div></section>${footer()}`;$('#pageSize').value=String(state.pageSize);$('#pageSize').onchange=e=>{state.pageSize=Number(e.target.value);toast('Page size updated')};$('#editToggle').onchange=e=>{state.editMode=e.target.checked;localStorage.setItem(K.edit,String(state.editMode));render();toast(`Edit Mode ${state.editMode?'ON':'OFF'}`)};$('#themeToggle').onchange=e=>{state.theme=e.target.checked?'dark':'light';document.documentElement.dataset.theme=state.theme;localStorage.setItem(K.theme,state.theme);render();};$('#makeSnapshot').onclick=makeSnapshot;$('#manageSnapshots').onclick=manageSnapshots;$('#resetDb').onclick=()=>openConfirm('Reset to original dataset?','All local edits will be replaced with the exact source dataset. A backup is recommended.',()=>{backup();const old=deepClone(state.db);state.db=deepClone(ORIGINAL_DATASET);state.meta={...META_DEFAULT,lastModified:now(),version:(state.meta.version||1)+1};record('Reset Database','Original Dataset',old,deepClone(state.db),{type:'restoreDatabase',groups:old});saveDatabase();closeModal(true);render();toast('Original dataset restored')},{danger:true,backup:true})}
function makeSnapshot(){const snaps=JSON.parse(localStorage.getItem(K.snapshots)||'[]');snaps.unshift({id:uuid(),name:`Snapshot — ${new Date().toLocaleString()}`,timestamp:now(),groups:deepClone(state.db),meta:deepClone(state.meta)});localStorage.setItem(K.snapshots,JSON.stringify(snaps.slice(0,10)));render();toast('Snapshot created')}
function manageSnapshots(){const snaps=JSON.parse(localStorage.getItem(K.snapshots)||'[]');const body=snaps.map(s=>`<div class="similar"><div><b>${esc(s.name)}</b><div class="desc">${s.groups.length} groups</div></div><button class="btn small snapRestore" data-id="${s.id}">Restore</button></div>`).join('');openModal('Snapshots','Restore a saved local snapshot.',body,[{label:'Close',kind:'secondary',close:true}]);$$('.snapRestore').forEach(b=>b.onclick=()=>{const s=snaps.find(x=>x.id===b.dataset.id);if(!s)return;backup();const old=deepClone(state.db);state.db=deepClone(s.groups);state.meta={...s.meta,lastModified:now(),version:(state.meta.version||1)+1};record('Restore Snapshot',s.name,old,deepClone(state.db),{type:'restoreDatabase',groups:old});saveDatabase();closeModal(true);render();toast('Snapshot restored')})}
function openModal(title,sub,body,buttons=[],opts={}){const root=$('#modalRoot');root.innerHTML=`<div class="modal-overlay" role="dialog" aria-modal="true"><div class="modal ${opts.wide?'wide':''}"><div class="modal-head"><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:''}</div><div class="modal-body">${body}</div><div class="modal-foot"></div></div></div>`;const foot=$('.modal-foot',root);for(const x of buttons){const b=document.createElement('button');b.className='btn '+(x.kind==='primary'?'primary':x.kind==='danger'?'danger':'');b.textContent=x.label;b.onclick=()=>{if(x.close)return closeModal();x.action?.(b)};foot.appendChild(b)}$('.modal-overlay',root).onclick=e=>{if(e.target.classList.contains('modal-overlay'))requestModalClose()};document.addEventListener('keydown',modalEsc);setTimeout(()=>$('.modal input,.modal select,.modal textarea')?.focus(),0)}
function modalEsc(e){if(e.key==='Escape')requestModalClose()}
function requestModalClose(){if(state.unsaved){if(confirm('You have unsaved changes. Close without saving?'))closeModal(true)}else closeModal(true)}
function closeModal(force=false){if(state.unsaved&&!force)return requestModalClose();state.unsaved=false;$('#modalRoot').innerHTML='';document.removeEventListener('keydown',modalEsc)}
function openConfirm(title,text,onConfirm,{danger=false,backup:backupOption=false}={}){const body=`<div class="notice ${danger?'danger':'warning'}">${esc(text)}</div>${backupOption?'<label style="display:flex;align-items:center;gap:8px;margin-top:14px"><input id="backupBefore" class="checkbox" type="checkbox" checked> Download Backup Before Continuing</label>':''}`;openModal(title,'Please review before continuing.',body,[{label:'Cancel',close:true},{label:'Confirm',kind:danger?'danger':'primary',action:()=>{if(backupOption&&$('#backupBefore')?.checked)backup();onConfirm()}}])}
function openSimplePrompt(title,label,cb){openModal(title,'Enter a value to continue.',`<label class="form-label">${esc(label)}</label><input id="promptVal" class="input">`,[{label:'Cancel',close:true},{label:'Apply',kind:'primary',action:()=>{if(cb($('#promptVal').value)!==false)closeModal(true)}}])}
function openGroupEditor(g=null,prefill={},duplicate=false){const src=g?deepClone(g):{groupAddress:'',description:'',compositions:[],...prefill};const original=deepClone(src);const comps=dedup(src.compositions||[]);const title=g?'Edit Group':duplicate?'Duplicate Group':'Add New Group';const body=`<div class="field"><label class="form-label">GROUP ADDRESS *</label><input id="egAddress" class="input addr" value="${esc(src.groupAddress||'')}" autocomplete="off"></div><div class="field"><label class="form-label">DESCRIPTION</label><textarea id="egDesc" class="textarea" style="min-height:86px">${esc(src.description||'')}</textarea></div><div class="field"><label class="form-label">COMPOSITION</label><div style="display:flex;gap:8px;margin-bottom:8px"><input id="egSingle" class="input addr" placeholder="Add composition..."><button id="addSingle" class="btn">Add</button></div><textarea id="egPaste" class="textarea" placeholder="Paste multiple addresses separated by space, newline, comma, semicolon or tab"></textarea><div class="help">Press Enter in “Add composition...” for one address, or paste many addresses below.</div><button id="addPasted" class="btn small" style="margin-top:8px">Add pasted</button><div id="egChips" class="chips"></div></div><div id="egWarn"></div><div id="egDiff"></div>`;openModal(title,g?'Update the group safely and review the change diff before saving.':'Create a Group Address in the local database.',body,[{label:'Cancel',action:()=>requestModalClose()},{label:'Save',kind:'primary',action:()=>saveGroupEditor(g,original)}]);let working=[...comps];const draw=()=>{const area=$('#egChips');area.innerHTML='';for(const c of working){const d=document.createElement('div');d.className='chip';const s=document.createElement('span');s.textContent=c;const x=document.createElement('button');x.className='mini icon';x.innerHTML=icon('x');x.onclick=()=>{const used=(state.indexes.comp.get(c)?.size||0)-(g&&g.compositions.includes(c)?1:0);if(used>0&&!confirm(`${c} is also used in ${used} other groups. Remove only from this group?`))return;working=working.filter(z=>z!==c);state.unsaved=true;draw();drawDiff()};d.append(s,x);area.appendChild(d)}$('#egChips').dataset.comps=JSON.stringify(working)};const drawDiff=()=>{if(!g)return;const a=new Set(original.compositions),b=new Set(working),add=[...b].filter(x=>!a.has(x)),rem=[...a].filter(x=>!b.has(x)),same=[...a].filter(x=>b.has(x)).length;$('#egDiff').innerHTML=`<div class="diff"><div class="diff-box"><h3>ADDED</h3>${add.length?add.map(x=>`<div class="addr" style="color:var(--success)">+ ${esc(x)}</div>`).join(''):'<span class="muted">None</span>'}</div><div class="diff-box"><h3>REMOVED</h3>${rem.length?rem.map(x=>`<div class="addr" style="color:var(--danger)">− ${esc(x)}</div>`).join(''):'<span class="muted">None</span>'}</div></div><div class="help">UNCHANGED — ${same} addresses</div>`};const addOne=()=>{const c=norm($('#egSingle').value);if(!c)return;const before=working.length;working=dedup([...working,c]);$('#egSingle').value='';if(working.length===before)toast('Duplicate compositions removed','warning');state.unsaved=true;draw();drawDiff()};$('#addSingle').onclick=addOne;$('#egSingle').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addOne()}};$('#addPasted').onclick=()=>{const a=parseComps($('#egPaste').value),before=working.length;working=dedup([...working,...a]);$('#egPaste').value='';if(working.length<before+a.length)toast('Duplicate compositions removed','warning');state.unsaved=true;draw();drawDiff()};['egAddress','egDesc','egPaste','egSingle'].forEach(id=>$('#'+id).addEventListener('input',()=>state.unsaved=true));$('#egChips').dataset.get=()=>working;draw();drawDiff();$('#egChips')._getComps=()=>working}
function saveGroupEditor(g,original){const address=norm($('#egAddress').value),description=$('#egDesc').value.trim(),comps=$('#egChips')._getComps?$('#egChips')._getComps():[];if(!address)return toast('GROUP ADDRESS is required','error');const warnings=validationWarnings(address,comps);if(warnings.length){$('#egWarn').innerHTML=`<div class="notice warning">${warnings.map(esc).join('<br>')}<br><b>Press Save again to force save.</b></div>`;if(!$('#egWarn').dataset.confirmed){$('#egWarn').dataset.confirmed='1';return}}try{const saved=g?updateGroup(g.id,{groupAddress:address,description,compositions:comps}):addGroup({groupAddress:address,description,compositions:comps});state.unsaved=false;closeModal(true);navigate('group',{address:saved.groupAddress});toast('Saved')}catch(e){toast(e.message,'error')}}
function confirmDelete(g){const body=`<div class="notice danger">Delete <b class="addr">${esc(g.groupAddress)}</b>? This group contains ${g.compositions.length} compositions.</div><div class="field" style="margin-top:16px"><label class="form-label">Type ${esc(g.groupAddress)} to confirm</label><input id="delConfirm" class="input addr" autocomplete="off"></div>`;openModal(`Delete ${g.groupAddress}?`,'This action removes only this Group Address.',body,[{label:'Cancel',close:true},{label:'Delete',kind:'danger',action:()=>{if(norm($('#delConfirm').value)!==g.groupAddress)return toast('Confirmation does not match','error');deleteGroup(g.id);closeModal(true);navigate('directory');toast(`${g.groupAddress} deleted`)}}])}
function openGlobalRename(oldC){const ids=[...(state.indexes.comp.get(oldC)||[])];const gs=ids.map(id=>state.db.find(g=>g.id===id)).filter(Boolean);const body=`<div class="notice warning">This change may affect <b>${gs.length} Group Addresses</b>.</div><div class="split" style="margin-top:16px"><div><label class="form-label">Old</label><input class="input addr" value="${esc(oldC)}" disabled></div><div><label class="form-label">New</label><input id="newComp" class="input addr"></div></div><div class="field" style="margin-top:16px"><label class="form-label">Scope</label><select id="renameScope" class="select"><option value="all">Replace Globally</option><option value="selected">Replace Selected Groups</option></select></div><div id="renameGroups" class="card" style="padding:10px">${gs.map(g=>`<label style="display:flex;gap:9px;align-items:center;padding:7px"><input class="checkbox renameSel" type="checkbox" data-id="${g.id}" checked><span class="addr">${esc(g.groupAddress)}</span><span class="desc">${esc(g.description)}</span></label>`).join('')}</div>`;openModal(`Rename ${oldC}`,'Review every affected group before applying the change.',body,[{label:'Cancel',close:true},{label:'Rename',kind:'primary',action:()=>{const n=norm($('#newComp').value);if(!n)return toast('New composition is required','error');const warnings=validationWarnings('OK',[n]);if(warnings.length&&!confirm(warnings.join('\n')+'\nContinue anyway?'))return;const sel=$('#renameScope').value==='selected'?$$('.renameSel:checked').map(x=>x.dataset.id):null;backup();const count=renameCompositionGlobally(oldC,n,sel);closeModal(true);navigate('composition',{comp:n});toast(`${count} groups updated`)}}],{wide:true});$('#renameScope').onchange=e=>$('#renameGroups').classList.toggle('hidden',e.target.value==='all')}
function openPalette(){const commands=[['Search Group',()=>navigate('search')],['Search Composition',()=>navigate('search')],['Add Group',()=>state.editMode?openGroupEditor():toast('Turn on Edit Mode first','warning')],['Compare Groups',()=>navigate('compare')],['Import',()=>navigate('io')],['Export',()=>exportJSON()],['Settings',()=>navigate('settings')]];const body=`<input id="palSearch" class="input" placeholder="Type a command..."><div id="palList" class="palette-list"></div>`;openModal('Command Palette','Navigate or run common actions.',body,[{label:'Close',close:true}],{});const draw=()=>{const q=norm($('#palSearch').value);const f=commands.filter(x=>!q||norm(x[0]).includes(q));$('#palList').innerHTML='';f.forEach(([label,fn])=>{const b=document.createElement('button');b.className='palette-item';b.innerHTML=`<span>${esc(label)}</span><span class="muted">↵</span>`;b.onclick=()=>{closeModal(true);fn()};$('#palList').appendChild(b)})};$('#palSearch').oninput=draw;draw()}
function openDrawer(){$('#sidebar').classList.add('open');$('#drawerShade').classList.remove('hidden')}
function closeDrawer(){$('#sidebar').classList.remove('open');$('#drawerShade').classList.add('hidden')}
function wireGlobal(){setIcon($('#menuBtn'),'menu');setIcon($('#settingsBtn'),'settings');$('#headerSearchIcon').innerHTML=icon('search');$('#menuBtn').onclick=openDrawer;$('#drawerShade').onclick=closeDrawer;$('#settingsBtn').onclick=()=>navigate('settings');$('#backupBtn').onclick=backup;$('#globalSearch').oninput=e=>{const q=e.target.value;navigate('search',{query:q});setTimeout(()=>{const ps=$('#pageSearch');if(ps){ps.value=q;ps.focus();runSearch()}},0)};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette();return}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#globalSearch').focus();return}if(state.route.name==='search'&&!$('#modalRoot').children.length){const cards=$$('.result');if(e.key==='ArrowDown'&&cards.length){e.preventDefault();state.searchSel=Math.min(cards.length-1,state.searchSel+1);cards.forEach((x,i)=>x.classList.toggle('selected',i===state.searchSel));cards[state.searchSel].scrollIntoView({block:'nearest'})}else if(e.key==='ArrowUp'&&cards.length){e.preventDefault();state.searchSel=Math.max(0,state.searchSel-1);cards.forEach((x,i)=>x.classList.toggle('selected',i===state.searchSel));cards[state.searchSel].scrollIntoView({block:'nearest'})}else if(e.key==='Enter'&&cards[state.searchSel]&&document.activeElement.tagName!=='TEXTAREA'){cards[state.searchSel].click()}}});window.addEventListener('beforeunload',e=>{if(state.unsaved){e.preventDefault();e.returnValue=''}})}
load();wireGlobal();render();
</script>
</body></html>
